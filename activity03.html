      hint: 'Start with origin. Was it created by or for the Government under a contract? If not, it is neither, however sensitive it is. If so, does a CUI category apply (for example, Controlled Technical Information or a category the contract names)? Watch for the two FCI exclusions: public information and simple transactional information.',
