            { q: 'A teammate writes, “CMMC requires them to protect CUI.” What would make this claim pass the Authority test?', concept: 'standard', options: ['Add that every accredited C3PAO enforces this obligation in every assessment', 'Name the clause or section that imposes it', 'Cite the slide in the training deck where the rule is stated', 'Say it comes from the CMMC program, which is the governing body'], answer: 1, why: 'Authority means naming what imposes the requirement: the clause, the section, or the Registry category. “CMMC requires it” names a program, not an instrument (D). C3PAOs assess against requirements; they do not create them (A). A training deck is instructional, never authority (C).' },
