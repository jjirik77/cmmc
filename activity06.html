      review: { href: 'lesson05.html#s3', label: 'Lesson 5, Methods and objects' },
      items: [
        { text: 'Sign in to the PLM with a sample account and see whether a second factor is required', answer: 2, why: 'Exercising a mechanism and comparing actual to expected behavior is a test. It shows the control works now, on what you tested, not last quarter.' },
        { text: 'Read the full Conditional Access policy export, including the exclusions list', answer: 0, why: 'Reviewing a configuration is examine. It shows what is configured, not that anyone follows it. The exclusions list is where these policies usually leak.' },
        { text: 'Ask the HR Director to walk you through what happened to the last departing employee’s accounts', answer: 1, why: 'A discussion with a person is an interview. On its own it generates leads to corroborate, not conclusions.' },

      hint: 'A good policy in a company that ignores it is still adequate. An assertion, even in writing, is neither. A document that does not address the objective is not adequate, however official it looks.',

      review: { href: 'lesson05.html#s4', label: 'Lesson 5, Five artifacts, evaluated' },

        { text: 'A current MFA configuration export covering every in-scope system, plus a sample of enrolled accounts', answer: 0, why: 'It addresses the objective, covers the scope, is current, and the sample shows the control operating. That is the lesson’s example of sufficient MFA evidence.' },
